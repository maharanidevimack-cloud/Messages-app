<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communicate App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <div class="app-logo-large">💬</div>
            <h1>Communicate</h1>
            <p>Connecting people seamlessly</p>
        </div>
    </div>

    <!-- 2. LOGIN SCREEN (Google One-Tap / Popup) -->
    <div id="login-screen" class="screen">
        <div class="auth-card" style="text-align: center; padding: 40px 20px;">
            <div class="app-logo-large" style="font-size: 40px; margin-bottom: 15px;">💬</div>
            <h2>Welcome to Communicate</h2>
            <p style="margin-bottom: 30px; color: rgba(255,255,255,0.6);">Fast, secure, and passwordless chat</p>
            
            <!-- Google Sign-In Button -->
            <button class="auth-btn google-btn" onclick="handleGoogleLogin()" style="display: flex; align-items: center; justify-content: center; gap: 12px; background: #ffffff; color: #1f1f1f; font-weight: 600; width: 100%; border: none; border-radius: 12px; padding: 14px; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.21 21.34 7.28 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 11.7s.43 3.57 1.19 5.1l4.08-2.56z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.28 0 3.21 2.66 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- 3. HOME / CHAT SCREEN -->
    <div id="home-screen" class="screen">
        <div class="home-container">
            <!-- Header with Centered Logo & Title -->
            <div class="home-header">
                <div class="header-center-box">
                    <svg class="chat-logo-svg" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Communicate</span>
                </div>
            </div>
            
            <!-- Contact List Cards (Smooth Scrolling) -->
            <div class="contact-list" id="contact-list-box">
                <!-- Dynamically populated cards -->
            </div>

            <!-- Bottom-Right Floating Premium "New Chat" Button -->
            <button class="fab-btn-corner" onclick="goToNewChatPage()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                New Chat
            </button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
