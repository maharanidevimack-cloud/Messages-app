<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communicate App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <div class="app-logo-large">💬</div>
            <h1>Communicate</h1>
            <p>Connecting people seamlessly</p>
        </div>
    </div>

    <!-- 2. LOGIN SCREEN (User ID & Password) -->
    <div id="login-screen" class="screen">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in with your User ID & Password</p>
            <input type="text" id="username-input" placeholder="User ID / Username">
            <input type="password" id="password-input" placeholder="Password">
            <button class="auth-btn" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <!-- 3. HOME / CHAT SCREEN -->
    <div id="home-screen" class="screen">
        <div class="home-container">
            <!-- Header with Centered Logo & Title -->
            <div class="home-header">
                <div class="header-center-box">
                    <svg class="chat-logo-svg" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Communicate</span>
                </div>
            </div>
            
            <!-- Contact List Cards (Smooth Scrolling) -->
            <div class="contact-list" id="contact-list-box">
                <!-- Dynamically populated cards -->
            </div>

            <!-- Bottom-Right Floating Premium "New Chat" Button -->
            <button class="fab-btn-corner" onclick="goToNewChatPage()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                New Chat
            </button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
