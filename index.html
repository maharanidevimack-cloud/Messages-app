<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <div class="app-logo-large">💬</div>
            <h1>Communicate</h1>
            <p>Loading your secure chats...</p>
        </div>
    </div>

    <!-- 2. LOGIN SCREEN (Phone OTP) -->
    <div id="login-screen" class="screen">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Enter your mobile number to continue</p>
            
            <div id="phone-section">
                <input type="text" id="phone-number-input" placeholder="+91 Mobile Number" style="width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid rgba(0,0,0,0.1); font-size:15px; outline:none;">
                <button class="auth-btn" onclick="sendOTPCode()">Next</button>
            </div>

            <div id="otp-section" style="display: none;">
                <input type="text" id="otp-code-input" placeholder="Enter 6-digit OTP" style="width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid rgba(0,0,0,0.1); font-size:15px; outline:none;">
                <button class="auth-btn" onclick="verifyOTPCode()">Verify & Login</button>
            </div>

            <!-- Firebase invisible reCAPTCHA container -->
            <div id="recaptcha-container" style="margin-top: 10px;"></div>
        </div>
    </div>

    <!-- 3. HOME SCREEN -->
    <div id="home-screen" class="screen">
        <div class="home-container">
            <div class="home-header">
                <div class="header-center-box">
                    <span class="chat-logo-svg">💬</span> Chats
                </div>
            </div>

            <div class="home-search-wrapper">
                <div class="home-search-box">
                    <span>🔍</span>
                    <input type="text" id="home-search-input" placeholder="Search chats..." oninput="filterHomeChats(this.value)">
                </div>
            </div>

            <div id="contact-list-box" class="contact-list">
                <!-- Dynamic chats will load here -->
            </div>

            <button class="fab-btn-corner" onclick="goToNewChatPage()">
                <span>＋</span> New Chat
            </button>
        </div>
    </div>

    <!-- Firebase & App Logic Script -->
    <script type="module" src="script.js"></script>
</body>
</html>
